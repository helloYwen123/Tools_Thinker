prompt_template: |
  Write a Python program to answer the question related to images: 
  Question: {question}.
  Enclose the generated code and comments in <command> </command> tags,
  i.e. <command> generated python code </command>.
  You may include your thought process and analysis as inline comments within the code.
  Please make full use of the following available tools.
  Available Tools: {available_tools}
  Tools Metadata: {toolbox_metadata}
  If you need, please directly use the PATHs of images: {image_paths}, which are related to the question.
  Note:
  - The code output should be one of the options in Question: (A, B, C, D, or E). Assign your final choice to a variable named final_result.
  - If needed, include import paths like: from_module: `<tool_module_name>`, import_name: `<tool_class_name>`.

# {question}；{available_tools}；{available_tools}；{image_paths}

# metadata for available tools
toolbox_metadata:
  Object_Detector_Tool:
    tool_module_name: "object_detector"
    tool_class_name: "Object_Detector_Tool"
    tool_description: "A tool that detects objects in an image using the Grounding DINO model and saves individual object images with empty padding."
    tool_version: "1.0.0"
    input_types:
      image: "str - The path to the image file."
      labels: "list - A list of object labels to detect."
      threshold: "float - The confidence threshold for detection (default: 0.45)."
      model_size: "str - The size of the model to use ('tiny' or 'base', default: 'tiny')."
      save_object: "bool - Whether to save the detected objects as images (default: False)."
      saved_image_path: "str - The path to save the detected object images (default: 'detected_objects')."
    output_types: >
      tuple - A tuple containing two elements: 
        (1) a dictionary mapping each detected label to its grouped detection results,
            where each value is a dictionary with keys 'boxes', 'confidence_scores', and 'saved_image_paths';
        (2) a dictionary mapping each label to its total count in the image.
    demo_commands:
      - command: 'detected_objects, object_number = Object_Detector_Tool.execute(image="path/to/image.png", labels=["baseball", "basket"], save_object=True, saved_image_path="detected_objects")'
        description: >
          Detects 'baseball' and 'basket' in the image.
          Returns a tuple: (1) a dictionary grouping results by label with boxes, scores, and image paths;
          (2) a dictionary with counts for each label.
          Detected objects are saved to 'detected_objects' if 'save_object' is True.
        output_example: >
          detected_objects = {'baseball': [{'box': (34, 50, 200, 220), 'score': 0.92, 'saved_image_path': 'detected_objects/image_baseball_1.png'}],
                              'basket': [{'box': (220, 100, 400, 350), 'score': 0.85, 'saved_image_path': 'detected_objects/image_basket_1.png'}]}
          object_number = {'baseball': 1, 'basket': 2}
    user_metadata:
      potential usage: "The tool can be used for locating interest-objects in images by utilizing the bounding boxes"
  
  ######################

# available_tools for usage
available_tools: "Object_Detector_Tool"